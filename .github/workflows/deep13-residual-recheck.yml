name: Temporary Deep 13 residual recheck

on:
  push:
    branches: [main]
    paths:
      - '.github/deep-inherited-debt.json'
      - '.github/workflows/deep13-residual-recheck.yml'
      - 'tools/deep_cdda_runtime.py'
      - 'tools/deep_summary.py'
      - 'tests/test_deep_runtime.py'

permissions:
  contents: read
  actions: read

jobs:
  exact-recheck:
    name: Exact exhaustive / ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        suite:
          - component-aftershock_prime_mom
          - profile-all-content
          - combined-all-json
    env:
      DEEP_TARGET: experimental-2026-09-23-0546
      CDDA_COMMIT: e262adb299a7613b4aedc5f12c08fe0413c56a84
      CATA_TEST_ARTIFACT_ID: '11101923048'
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: ${{ env.CDDA_COMMIT }}
          path: cdda
          fetch-depth: 1
          persist-credentials: false

      - name: Reuse exact cata_test from Deep 13
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p cdda/tests build/cata-artifact
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CATA_TEST_ARTIFACT_ID}/zip" \
            > build/cata-test.zip
          unzip -q build/cata-test.zip -d build/cata-artifact
          cp build/cata-artifact/cata_test cdda/tests/cata_test
          chmod +x cdda/tests/cata_test

      - name: Run current payload exhaustively
        working-directory: harness
        shell: bash
        run: |
          python tools/deep_cdda_runtime.py run-source \
            --cdda-root ../cdda \
            --target "$DEEP_TARGET" \
            --suite "${{ matrix.suite }}" \
            --depth exhaustive \
            --out "../build/recheck/${{ matrix.suite }}" \
            --timeout 10800

      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep13-residual-${{ matrix.suite }}
          path: build/recheck/${{ matrix.suite }}/**
          if-no-files-found: warn
          retention-days: 7
