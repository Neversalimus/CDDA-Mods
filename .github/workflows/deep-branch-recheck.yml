name: Temporary exact-runtime branch recheck

on:
  push:
    branches:
      - infra/exhaustive-isolation-axiom-fixes
    paths:
      - '.github/workflows/deep-branch-recheck.yml'
      - 'mods/**'
      - 'tools/deep_cdda_runtime.py'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: temporary-exact-recheck-${{ github.ref }}
  cancel-in-progress: true

# Refresh marker: rerun exact post-Deep-12 verification on current branch content.
env:
  DEEP_TARGET: experimental-2026-09-23-0546
  CDDA_COMMIT: e262adb299a7613b4aedc5f12c08fe0413c56a84
  CATA_TEST_ARTIFACT_ID: '11067638496'

jobs:
  exact-recheck:
    name: Exact recheck / ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        suite:
          - component-axiom_7
          - component-secronom
          - component-secronom_plus
          - component-blazemod
          - component-tankmod
          - component-aftershock_prime
    steps:
      - name: Checkout CDDA-Mods branch
        uses: actions/checkout@v4
        with:
          path: mods-repo

      - name: Checkout exact CDDA source tree
        uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: ${{ env.CDDA_COMMIT }}
          path: cdda
          fetch-depth: 1
          persist-credentials: false

      - name: Reuse exact cata_test binary from Deep #12
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cdda/tests build/cata-artifact
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CATA_TEST_ARTIFACT_ID}/zip" \
            > build/cata-test.zip
          unzip -q build/cata-test.zip -d build/cata-artifact
          cp build/cata-artifact/cata_test cdda/tests/cata_test
          chmod +x cdda/tests/cata_test

      - name: Run current branch against exact CDDA runtime
        shell: bash
        working-directory: mods-repo
        run: |
          set +e
          python tools/deep_cdda_runtime.py run-source \
            --cdda-root ../cdda \
            --target "${DEEP_TARGET}" \
            --suite "${{ matrix.suite }}" \
            --depth full \
            --out "../build/recheck/${{ matrix.suite }}" \
            --timeout 7200
          code=$?
          if [ "$code" -ne 0 ]; then
            while IFS= read -r log; do
              echo "::group::$log"
              tail -n 5000 "$log" || true
              echo "::endgroup::"
            done < <(
              find "../build/recheck/${{ matrix.suite }}" -type f \
                \( -name 'stdout.log' -o -name 'stderr.log' \) | sort
            )
          fi
          exit "$code"

      - name: Upload exact recheck evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporary-recheck-${{ matrix.suite }}
          path: build/recheck/${{ matrix.suite }}/**
          if-no-files-found: warn
          retention-days: 7

  upstream-aftershock-debt:
    name: Upstream Aftershock debt baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout exact CDDA runtime tree
        uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: ${{ env.CDDA_COMMIT }}
          path: cdda
          fetch-depth: 1

      - name: Reuse exact cata_test binary from Deep #12
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cdda/tests build/cata-artifact
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CATA_TEST_ARTIFACT_ID}/zip" \
            > build/cata-test.zip
          unzip -q build/cata-test.zip -d build/cata-artifact
          cp build/cata-artifact/cata_test cdda/tests/cata_test
          chmod +x cdda/tests/cata_test

      - name: Capture pinned upstream Aftershock failures
        shell: bash
        working-directory: cdda
        run: |
          mkdir -p ../build/upstream-aftershock/user
          set +e
          tests/cata_test \
            --mods=aftershock_exoplanet \
            --user-dir=../build/upstream-aftershock/user \
            --rng-seed 0 \
            --order lex \
            --error-format=github-action \
            '~[slow] ~[.] ~[axiom7_lifecycle] ~"item_new_to_hit_enforcement" ~"uncraft_blacklist_is_pruned",starting_items' \
            > ../build/upstream-aftershock/stdout.log \
            2> ../build/upstream-aftershock/stderr.log
          code=$?
          echo "$code" > ../build/upstream-aftershock/exit-code.txt
          echo "Pinned upstream exit code: $code"
          echo "::group::upstream stdout tail"
          tail -n 2500 ../build/upstream-aftershock/stdout.log || true
          echo "::endgroup::"
          echo "::group::upstream stderr tail"
          tail -n 2500 ../build/upstream-aftershock/stderr.log || true
          echo "::endgroup::"
          exit 0

      - name: Upload upstream debt evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporary-upstream-aftershock-debt
          path: build/upstream-aftershock/**
          if-no-files-found: warn
          retention-days: 7

