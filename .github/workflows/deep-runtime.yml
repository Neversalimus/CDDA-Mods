name: Deep real-CDDA runtime

on:
  workflow_dispatch:
    inputs:
      target:
        description: Catalog target ID
        required: true
        default: experimental-2026-09-23-0546
        type: string
      depth:
        description: Source-runtime depth
        required: true
        default: full
        type: choice
        options:
          - load
          - full
          - exhaustive
      release_binary:
        description: Run official release-binary checks
        required: true
        default: true
        type: boolean
      source_runtime:
        description: Build exact CDDA source and run cata_test
        required: true
        default: true
        type: boolean
      installation_matrix:
        description: Run shipped installer lifecycle matrix on real CDDA
        required: true
        default: true
        type: boolean
  schedule:
    # Weekly deep runs are ON by default; set CDDA_DEEP_TESTS_ENABLED=false to disable.
    - cron: '17 2 * * 0'

permissions:
  contents: read

concurrency:
  group: deep-real-cdda-${{ github.ref }}
  cancel-in-progress: false

env:
  DEEP_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || vars.CDDA_DEEP_TESTS_TARGET || 'experimental-2026-09-23-0546' }}
  DEEP_DEPTH: ${{ github.event_name == 'workflow_dispatch' && inputs.depth || vars.CDDA_DEEP_TESTS_DEPTH || 'exhaustive' }}

jobs:
  release-binary:
    name: Official release binary / loader matrix
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && (inputs.release_binary || inputs.installation_matrix)) ||
        (github.event_name == 'schedule' && vars.CDDA_DEEP_TESTS_ENABLED != 'false')
      }}
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Static repository gate
        run: python tools/modsuite.py validate

      - name: Download exact official CDDA release
        shell: pwsh
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: >
          python tools/fetch_cdda_release.py
          --target "$env:DEEP_TARGET"
          --out build/cdda-release
          --token "$env:GH_API_TOKEN"

      - name: Run baseline, every JSON component, profiles and combined stack
        if: ${{ github.event_name == 'schedule' || inputs.release_binary }}
        shell: pwsh
        run: |
          $gameRoot=(Get-Content build/cdda-release/game-root.txt -Raw).Trim()
          python tools/deep_cdda_runtime.py run-release `
            --game-root "$gameRoot" `
            --target "$env:DEEP_TARGET" `
            --out build/deep-release `
            --timeout 900
          if($LASTEXITCODE){exit $LASTEXITCODE}

      - name: Build the exact shipped installer candidate
        if: ${{ github.event_name == 'schedule' || inputs.installation_matrix }}
        run: python tools/modsuite.py build --out dist

      - name: Run clean install / repeat / update / rollback / failure matrix
        if: ${{ github.event_name == 'schedule' || inputs.installation_matrix }}
        shell: powershell
        run: |
          $gameRoot=(Get-Content build/cdda-release/game-root.txt -Raw).Trim()
          ./tools/deep_install_matrix.ps1 `
            -GameRoot "$gameRoot" `
            -PackageRoot "$pwd/dist" `
            -Target "$env:DEEP_TARGET" `
            -Out "$pwd/build/deep-install-matrix" `
            -ValidationTimeout 900
          if($LASTEXITCODE){exit $LASTEXITCODE}

      - name: Upload installer-lifecycle evidence
        if: always() && (github.event_name == 'schedule' || inputs.installation_matrix)
        uses: actions/upload-artifact@v4
        with:
          name: deep-install-matrix-${{ env.DEEP_TARGET }}
          path: build/deep-install-matrix/**
          if-no-files-found: warn
          retention-days: 30

      - name: Upload binary-runtime evidence
        if: always() && (github.event_name == 'schedule' || inputs.release_binary)
        uses: actions/upload-artifact@v4
        with:
          name: deep-release-${{ env.DEEP_TARGET }}
          path: |
            build/deep-release/**
            build/cdda-release/release.json
          if-no-files-found: warn
          retention-days: 30

  source_plan:
    name: Resolve exact source-runtime matrix
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs.source_runtime) ||
        (github.event_name == 'schedule' && vars.CDDA_DEEP_TESTS_ENABLED != 'false')
      }}
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.plan.outputs.commit }}
      suites: ${{ steps.plan.outputs.suites }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: plan
        shell: bash
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('tools').resolve()))
          import deep_cdda_runtime as deep

          target=os.environ['DEEP_TARGET']
          target_doc=json.loads((Path('catalog/targets')/(target+'.json')).read_text(encoding='utf-8'))
          _, rows=deep.build_suites(target)
          suites=[row['name'] for row in rows]
          if not suites:
              raise SystemExit('Source runtime matrix is empty')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('commit='+target_doc['commit']+'\n')
              f.write('suites='+json.dumps({'suite':suites},separators=(',',':'))+'\n')
          print(json.dumps({'commit':target_doc['commit'],'suites':suites},indent=2))
          PY

  source_build:
    name: Build exact CDDA cata_test once
    needs: source_plan
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: ${{ needs.source_plan.outputs.commit }}
          path: external/cdda
          fetch-depth: 1
          persist-credentials: false

      - name: Install curses build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncursesw5-dev ccache gettext parallel
          ccache --max-size=5G
          ccache --zero-stats

      - name: Cache compiler output
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: cdda-cata-test-${{ runner.os }}-${{ needs.source_plan.outputs.commit }}
          restore-keys: |
            cdda-cata-test-${{ runner.os }}-

      - name: Build and smoke the real engine test executable
        working-directory: external/cdda
        shell: bash
        run: |
          set -euo pipefail
          bash ./build-scripts/requirements.sh
          make -j2 RELEASE=1 LOCALIZE=0 TILES=0 SOUND=0 TESTS=1 ASTYLE=0 LINTJSON=0 CCACHE=1
          test -x tests/cata_test
          ./tests/cata_test "[force_load_game]" --user-dir=baseline-build-smoke
          ccache --show-stats || true

      - uses: actions/upload-artifact@v4
        with:
          name: cata-test-${{ needs.source_plan.outputs.commit }}
          path: external/cdda/tests/cata_test
          if-no-files-found: error
          retention-days: 7

  source-runtime:
    name: Exact source / ${{ matrix.suite }}
    needs: [source_plan, source_build]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.source_plan.outputs.suites) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: ${{ needs.source_plan.outputs.commit }}
          path: external/cdda
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: cata-test-${{ needs.source_plan.outputs.commit }}
          path: external/cdda/tests

      - name: Prepare exact-source runtime
        shell: bash
        run: |
          chmod +x external/cdda/tests/cata_test
          sudo apt-get update
          sudo apt-get install -y libncursesw6

      - name: Run one isolated mod/profile suite
        shell: bash
        run: |
          python tools/deep_cdda_runtime.py run-source \
            --cdda-root external/cdda \
            --target "$DEEP_TARGET" \
            --out "build/deep-source/${{ matrix.suite }}" \
            --depth "$DEEP_DEPTH" \
            --suite "${{ matrix.suite }}" \
            --timeout 10800

      - name: Upload source-runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-source-${{ matrix.suite }}-${{ env.DEEP_DEPTH }}
          path: build/deep-source/${{ matrix.suite }}/**
          if-no-files-found: warn
          retention-days: 30
