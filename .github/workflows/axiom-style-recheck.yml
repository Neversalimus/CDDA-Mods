name: Temporary AXIOM text-style recheck

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/axiom-style-recheck.yml'

permissions:
  contents: read
  actions: read

jobs:
  exact-style:
    name: AXIOM exact-source style zero
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DEEP_TARGET: experimental-2026-09-23-0546
      CDDA_COMMIT: e262adb299a7613b4aedc5f12c08fe0413c56a84
      CATA_TEST_ARTIFACT_ID: '11101923048'
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: ${{ env.CDDA_COMMIT }}
          path: cdda
          fetch-depth: 1
          persist-credentials: false

      - name: Reuse exact cata_test from Deep 13
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p cdda/tests build/cata-artifact
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CATA_TEST_ARTIFACT_ID}/zip" \
            > build/cata-test.zip
          unzip -q build/cata-test.zip -d build/cata-artifact
          cp build/cata-artifact/cata_test cdda/tests/cata_test
          chmod +x cdda/tests/cata_test

      - name: Load current AXIOM payload
        working-directory: harness
        shell: bash
        run: |
          python tools/deep_cdda_runtime.py run-source \
            --cdda-root ../cdda \
            --target "$DEEP_TARGET" \
            --suite component-axiom_7 \
            --depth load \
            --out ../build/axiom-style \
            --timeout 3600

      - name: Require zero text-style warnings
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("build/axiom-style/report.json").read_text(encoding="utf-8"))
          warnings=[]
          for run in report["runs"]:
              warnings.extend(run["result"].get("style_warnings") or [])
          if warnings:
              print("\n".join(warnings))
              raise SystemExit(f"AXIOM still has {len(warnings)} text-style warnings")
          print("AXIOM exact-source text style: 0 warnings")
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axiom-style-zero
          path: build/axiom-style/**
          if-no-files-found: warn
          retention-days: 7
