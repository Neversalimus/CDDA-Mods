name: Publish prepared release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install sprite audit dependency
        run: python -m pip install -r tools/sprite-qa-requirements.txt
      - name: Select immutable preview version
        id: version
        shell: pwsh
        run: |
          $c=Get-Content catalog/repository.json -Raw | ConvertFrom-Json
          $tag="v$($c.suite_version)"
          if($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_NAME -ne $tag){throw 'Tag/catalog version mismatch'}
          if($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:GITHUB_REF_NAME -ne 'main'){throw 'Manual release requires main'}
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - run: python tools/modsuite.py build
      - name: Verify packaged generated sprites
        shell: pwsh
        run: |
          python tools/audit_generated_sprites.py
          if($LASTEXITCODE){throw 'Source sprite audit failed'}
          $catalog=Get-Content dist/catalog.json -Raw | ConvertFrom-Json
          $packages=@($catalog.packages | Where-Object { $_.id -eq 'undeadpeople' -and $_.archive })
          if($packages.Count -eq 0){throw 'No UndeadPeople package to audit'}
          foreach($entry in $packages){
            python tools/audit_generated_sprites.py --package (Join-Path dist $entry.archive)
            if($LASTEXITCODE){throw 'Packaged sprite audit failed'}
          }
      - name: Windows PowerShell 5.1 installer tests
        shell: powershell
        run: ./tests/installer.tests.ps1
      - name: PowerShell 7 installer tests
        shell: pwsh
        run: ./tests/installer.tests.ps1
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Publish immutable PREVIEW assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$env:RELEASE_TAG" dist/* --target "$env:GITHUB_SHA" --prerelease --title "CDDA Mods $env:RELEASE_TAG PREVIEW" --notes-file docs/RELEASE_NOTES.md
          if($LASTEXITCODE){throw 'Release creation failed; existing tags/assets are never overwritten'}
