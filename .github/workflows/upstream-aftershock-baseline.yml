name: Temporary upstream Aftershock baseline

on:
  push:
    branches:
      - infra/exhaustive-isolation-axiom-fixes
    paths:
      - '.github/workflows/upstream-aftershock-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CDDA_COMMIT: e262adb299a7613b4aedc5f12c08fe0413c56a84
  CATA_TEST_ARTIFACT_ID: '11067638496'

jobs:
  upstream-aftershock:
    name: Dependency-complete upstream Aftershock baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout exact CDDA runtime tree
        uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: ${{ env.CDDA_COMMIT }}
          path: cdda
          fetch-depth: 1

      - name: Reuse exact cata_test binary from Deep #12
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cdda/tests build/cata-artifact
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CATA_TEST_ARTIFACT_ID}/zip" \
            > build/cata-test.zip
          unzip -q build/cata-test.zip -d build/cata-artifact
          cp build/cata-artifact/cata_test cdda/tests/cata_test
          chmod +x cdda/tests/cata_test

      - name: Capture dependency-complete upstream debt tests
        shell: bash
        working-directory: cdda
        run: |
          mkdir -p ../build/upstream-aftershock
          for spec in item_material_density_sanity_check uncraft_sanity_check; do
            out="../build/upstream-aftershock/$spec"
            mkdir -p "$out/user"
            set +e
            tests/cata_test \
              --mods=no_npc_food,aftershock_exoplanet \
              --user-dir="$out/user" \
              --rng-seed 0 \
              --order lex \
              --error-format=github-action \
              "$spec" \
              > "$out/stdout.log" \
              2> "$out/stderr.log"
            code=$?
            set -e
            echo "$code" > "$out/exit-code.txt"
            echo "$spec exit code: $code"
            echo "::group::$spec stdout"
            cat "$out/stdout.log" || true
            echo "::endgroup::"
            echo "::group::$spec stderr"
            tail -n 1000 "$out/stderr.log" || true
            echo "::endgroup::"
          done

      - name: Upload upstream debt evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporary-upstream-aftershock-dependency-complete
          path: build/upstream-aftershock/**
          if-no-files-found: warn
          retention-days: 7
