name: Verify and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

# Only the newest normal CI result for a branch/PR is actionable.
# Cancelling superseded runs saves runner time without reducing coverage of HEAD.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deep PowerShell harness syntax
        shell: powershell
        run: |
          $tokens=$null
          $errors=$null
          [Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/deep_install_matrix.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if($errors.Count){
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'Deep installer harness parser validation failed.'
          }
      - name: Build packages with catalog, syntax and payload validation
        # modsuite.py build calls the same full validate() gate before packaging.
        run: python tools/modsuite.py build
      - name: Windows PowerShell 5.1 installer tests
        shell: powershell
        run: ./tests/installer.tests.ps1
      - name: PowerShell 7 installer tests
        shell: pwsh
        run: ./tests/installer.tests.ps1
      - name: Python maintenance tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: CDDA-Mods-candidate
          path: dist/*
          # dist already consists mainly of compressed ZIP packages.
          compression-level: 0
  native:
    runs-on: windows-latest
    strategy:
      matrix:
        mod: [advanced_world_settings, survivor_progression]
    steps:
      - uses: actions/checkout@v4
        with:
          # Native jobs only need their own module, catalog binding and SDK prep tools.
          sparse-checkout: |
            catalog
            tools
            mods/${{ matrix.mod }}
      - name: Read exact external SDK commit
        id: sdk
        shell: pwsh
        run: |
          $m=Get-Content 'mods/${{ matrix.mod }}/manifest.json' -Raw | ConvertFrom-Json
          $c=Get-Content catalog/repository.json -Raw | ConvertFrom-Json
          $sha=if($m.sdk_commit){$m.sdk_commit}else{$c.ncmm_sdk.commit}
          "sha=$sha" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: Neversalimus/NCMM
          ref: ${{ steps.sdk.outputs.sha }}
          path: external/ncmm
          fetch-depth: 1
          persist-credentials: false
          # Native module CI consumes only the public SDK tree.
          sparse-checkout: |
            sdk
      - name: Prepare explicit API 1.7 build declarations
        run: python tools/prepare_survivor_sdk.py external/ncmm/sdk
      - name: Compile only the selected mod (no CDDA host build)
        shell: pwsh
        run: |
          cmake -S 'mods/${{ matrix.mod }}/native' -B 'build/${{ matrix.mod }}' -A x64 "-DNCMM_SDK_DIR=$pwd/external/ncmm/sdk"
          if($LASTEXITCODE){throw 'Configure failed'}
          cmake --build 'build/${{ matrix.mod }}' --config Release
          if($LASTEXITCODE){throw 'Compile failed'}
          New-Item -ItemType Directory -Force 'native-artifacts/${{ matrix.mod }}' | Out-Null
          Copy-Item 'build/${{ matrix.mod }}/Release/ncmm_mod.dll' 'native-artifacts/${{ matrix.mod }}/'
          Copy-Item 'mods/${{ matrix.mod }}/native/mod.json' 'native-artifacts/${{ matrix.mod }}/'
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.mod }}-candidate
          path: native-artifacts/*
