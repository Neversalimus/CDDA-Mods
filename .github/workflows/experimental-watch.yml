name: Automation · CDDA Experimental Watch

"on":
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/experimental-watch.yml'
      - 'tools/watch_experimentals.py'

permissions:
  contents: read
  actions: write

concurrency:
  group: cdda-mods-experimental-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover and dispatch unseen CDDA experimentals
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/watch_experimentals.py
