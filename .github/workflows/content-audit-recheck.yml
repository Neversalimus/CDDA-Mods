name: Temporary CDDA 1040 upgrade recheck

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/content-audit-recheck.yml'
      - '.github/workflows/deep-runtime.yml'
      - 'tools/content_inventory.py'
      - 'tools/deep_cdda_runtime.py'
      - 'tools/runtime_probes/content_catalog_test.cpp'
      - 'tests/test_deep_runtime.py'

permissions:
  contents: read

jobs:
  release:
    name: 1040 official release loader
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Static repository gate
        run: python tools/modsuite.py validate

      - name: Download exact official CDDA 1040
        shell: pwsh
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: >
          python tools/fetch_cdda_release.py
          --target experimental-2026-10-01-1040
          --out build/cdda-release
          --token "$env:GH_API_TOKEN"

      - name: Run every JSON component, profiles and combined stack
        shell: pwsh
        run: |
          $gameRoot=(Get-Content build/cdda-release/game-root.txt -Raw).Trim()
          python tools/deep_cdda_runtime.py run-release `
            --game-root "$gameRoot" `
            --target experimental-2026-10-01-1040 `
            --out build/deep-release `
            --timeout 900
          if($LASTEXITCODE){exit $LASTEXITCODE}

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdda-1040-release-recheck
          path: build/deep-release/**
          if-no-files-found: warn
          retention-days: 7

  build:
    name: Build exact cata_test with content probe
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    outputs:
      commit: ${{ steps.target.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - id: target
        working-directory: harness
        shell: bash
        run: |
          python tools/content_inventory.py \
            --target experimental-2026-10-01-1040 \
            --out ../build/content-inventory
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          doc=json.loads(Path("catalog/targets/experimental-2026-10-01-1040.json").read_text(encoding="utf-8"))
          print("commit="+doc["commit"])
          PY

      - uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: ${{ steps.target.outputs.commit }}
          path: external/cdda
          fetch-depth: 1
          persist-credentials: false

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! dpkg-query -W build-essential libncursesw5-dev ccache gettext parallel >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y build-essential libncursesw5-dev ccache gettext parallel
          fi
          ccache --max-size=5G

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: content-cata-test-${{ runner.os }}-${{ steps.target.outputs.commit }}
          restore-keys: |
            cdda-cata-test-${{ runner.os }}-

      - name: Inject runtime probes
        shell: bash
        run: |
          cp harness/tools/runtime_probes/axiom7_lifecycle_test.cpp \
            external/cdda/tests/axiom7_lifecycle_test.cpp
          cp harness/tools/runtime_probes/content_catalog_test.cpp \
            external/cdda/tests/content_catalog_test.cpp

      - name: Build exact test executable
        working-directory: external/cdda
        shell: bash
        run: |
          set -euo pipefail
          make -j2 RELEASE=1 LOCALIZE=0 TILES=0 SOUND=0 TESTS=1 ASTYLE=0 LINTJSON=0 CCACHE=1
          test -x tests/cata_test
          ./tests/cata_test "[force_load_game]" --rng-seed 0 --user-dir=baseline-build-smoke

      - uses: actions/upload-artifact@v4
        with:
          name: content-cata-test-${{ steps.target.outputs.commit }}
          path: external/cdda/tests/cata_test
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: content-inventory-recheck
          path: build/content-inventory/**
          if-no-files-found: error
          retention-days: 7

  audit:
    name: Content recheck / ${{ matrix.shard }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [items, recipes, vehicles, overmap]
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: ${{ needs.build.outputs.commit }}
          path: external/cdda
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: content-cata-test-${{ needs.build.outputs.commit }}
          path: external/cdda/tests

      - name: Prepare runtime
        shell: bash
        run: |
          chmod +x external/cdda/tests/cata_test
          if ! dpkg-query -W libncursesw6 >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libncursesw6
          fi

      - name: Run content shard
        working-directory: harness
        shell: bash
        run: |
          python tools/deep_cdda_runtime.py run-content \
            --cdda-root ../external/cdda \
            --target experimental-2026-10-01-1040 \
            --out "../build/content-${{ matrix.shard }}" \
            --shard "${{ matrix.shard }}" \
            --timeout 5400

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-recheck-${{ matrix.shard }}
          path: build/content-${{ matrix.shard }}/**
          if-no-files-found: warn
          retention-days: 7
